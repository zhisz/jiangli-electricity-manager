plugins {
    id "com.android.application"
}

/*
 * 公开仓库中的 gradle.properties 只保存空配置。开发者自己的地址和校付宝会话值放在
 * 已被 Git 忽略的 local.properties 中；CI 也可以改用同名 Gradle 属性注入。
 * 这样生产能力与开源代码解耦，不会因为一次 git add 泄露线上地址或会话凭据。
 */
def localConfig = new Properties()
def localConfigFile = rootProject.file("local.properties")
if (localConfigFile.isFile()) {
    localConfigFile.withInputStream { localConfig.load(it) }
}
def privateSetting = { String name ->
    String localValue = localConfig.getProperty(name, "").trim()
    return localValue.isEmpty()
            ? providers.gradleProperty(name).orElse("").get()
            : localValue
}
def javaString = { String value ->
    value.replace("\\", "\\\\").replace("\"", "\\\"")
}
def updateManifestUrl = javaString(privateSetting("UPDATE_MANIFEST_URL"))
def elecServiceBaseUrl = javaString(privateSetting("ELEC_SERVICE_BASE_URL"))
def xiaofubaoShiroJid = javaString(privateSetting("XIAOFUBAO_SHIRO_JID"))

/*
 * 正式签名参数只从被 Git 忽略的本地文件读取。密钥库本体位于仓库之外；公开源码和
 * 服务器只会拿到签名后的 APK，永远不会包含私钥或密码。
 */
def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file("release-signing.properties")
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace = "com.shangzhili.electricityreminder"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.zhisz.electricityreminder"
        minSdk = 26
        targetSdk = 36
        versionCode = 51
        versionName = "2.1.0"
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${updateManifestUrl}\""
        buildConfigField "String", "ELEC_SERVICE_BASE_URL", "\"${elecServiceBaseUrl}\""
        buildConfigField "String", "XIAOFUBAO_SHIRO_JID", "\"${xiaofubaoShiroJid}\""
    }

    signingConfigs {
        release {
            if (releaseSigningFile.isFile()) {
                storeFile = file(releaseSigning.getProperty("storeFile"))
                storePassword = releaseSigning.getProperty("storePassword")
                keyAlias = releaseSigning.getProperty("keyAlias")
                keyPassword = releaseSigning.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningFile.isFile()) signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    // 现有工程继续使用 Java/XML；引入稳定的 Material 3 Views 组件即可统一弹窗、按钮、
    // 卡片和主题，不必为一次视觉升级冒险重写全部业务为 Compose。
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.work:work-runtime:2.11.2"
    testImplementation "junit:junit:4.13.2"
    // JVM 单元测试需要真实 org.json 实现，以回归校付宝订单响应的严格字段校验。
    testImplementation "org.json:json:20240303"
}
