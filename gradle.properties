org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# 公开仓库中的值保持为空。开发者应复制到已忽略的 local.properties 后填写。
# 留空时版本检查会静默关闭，不影响本地电费查询和后台监测。
UPDATE_MANIFEST_URL=

# 匿名使用统计与开发者后台共用的服务根地址。留空即可完全关闭上报；
# 服务不可用时客户端也会静默失败，不影响查电费、提醒和本地数据。
ELEC_SERVICE_BASE_URL=

# 校付宝会话值属于私密配置，禁止提交真实值。这里只保留公开构建所需的空占位。
XIAOFUBAO_SHIRO_JID=
