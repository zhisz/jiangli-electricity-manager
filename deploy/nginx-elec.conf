server {
    listen 80;
    listen [::]:80;
    server_name electricity.example.com;

    root /srv/jiangli-electricity/current/public;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    # 更新策略需要立即生效，所以 update.json 不允许浏览器或中间代理缓存。
    location = /update.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 所有下载先由应用选择真实文件并计数，再通过 internal location 交给 Nginx
    # 零拷贝发送。/downloads/latest.apk 因而能长期作为固定分享地址。
    location ^~ /downloads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location ^~ /_protected_downloads/ {
        internal;
        alias /srv/jiangli-electricity/current/public/downloads/;
        types { application/vnd.android.package-archive apk; }
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # 公共历史只读接口由 Python 服务分页返回。gzip 可显著减少 30 天 JSON 流量；
    # 第三方 Cookie 和内部数据库从不经过此接口。
    location = /api/v1/public-history {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        gzip on;
        gzip_types application/json;
    }

    # 后台页面仍由应用自身的签名 Cookie 和 CSRF 保护。
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    # 固定产品页：/download 以及域名根路径均由应用动态展示当前版本。
    location = /download {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
